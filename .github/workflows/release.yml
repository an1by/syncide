name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag override (e.g. v0.2.0)"
        required: false
        type: string

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run unit & sandbox tests
        run: zig build test --summary all

  build:
    name: Cross-Compile Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build release targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build_win() {
            local target="$1"
            local label="$2"
            rm -rf build
            zig build -Dtarget="$target" -Doptimize=small
            cp build/syncide.exe "dist/syncide-${label}.exe"
            (cd build && zip -q "../dist/syncide-${label}.zip" syncide.exe)
          }

          build_unix() {
            local target="$1"
            local label="$2"
            rm -rf build
            zig build -Dtarget="$target" -Doptimize=small
            chmod +x build/syncide
            tar -C build -czf "dist/syncide-${label}.tar.gz" syncide
          }

          build_win  "x86_64-windows-gnu"  "windows-x86_64"
          build_win  "aarch64-windows-gnu" "windows-aarch64"
          build_unix "x86_64-linux-musl"   "linux-x86_64"
          build_unix "aarch64-linux-musl"  "linux-aarch64"
          build_unix "x86_64-macos"        "macos-x86_64"
          build_unix "aarch64-macos"       "macos-aarch64"

          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncide-binaries
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: syncide-binaries
          path: dist

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          FORCE_UPLOAD="false"
          if [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            [[ "${TAG}" == v* ]] || TAG="v${TAG}"
            FORCE_UPLOAD="true"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            TAG="${REF_NAME}"
            FORCE_UPLOAD="true"
          else
            VER=$(sed -n 's/.*\.version *= *"\([^"]*\)".*/\1/p' build.zig.zon | head -n 1)
            if [[ -z "${VER}" ]]; then
              echo "Could not parse .version from build.zig.zon" >&2
              exit 1
            fi
            TAG="v${VER}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [[ "${FORCE_UPLOAD}" == "true" ]]; then
              echo "Updating assets on existing release ${TAG}..."
              gh release upload "${TAG}" dist/* --clobber
            else
              echo "Release ${TAG} already published. Bump .version in build.zig.zon or push a new v* tag to create the next release."
            fi
          else
            echo "Creating new GitHub Release ${TAG}..."
            gh release create "${TAG}" dist/* \
              --title "syncide ${TAG}" \
              --generate-notes \
              --target "${TARGET_SHA}"
          fi
